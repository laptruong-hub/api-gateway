server:
  port: 8888

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:5173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

      # Route configurations
      routes:
        # ============ IAM Service Routes ============
        
        # Route 1: Authentication endpoints
        - id: iam-auth-route
          uri: ${IAM_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # Route 2: Admin user management endpoints
        - id: iam-admin-users-route
          uri: ${IAM_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=0

        # Route 3: Role management endpoints
        - id: iam-roles-route
          uri: ${IAM_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/roles/**
          filters:
            - StripPrefix=0

        # Route 4: Permission management endpoints
        - id: iam-permissions-route
          uri: ${IAM_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/permissions/**
          filters:
            - StripPrefix=0

        # ============ Car Management Service Routes ============
        
        # Route 5: Vehicle management endpoints
        - id: car-vehicles-route
          uri: ${CAR_MANAGEMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/vehicles/**
          filters:
            - StripPrefix=0

        # Route 6: Simulator control endpoints
        - id: car-simulator-route
          uri: ${CAR_MANAGEMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/simulator/**
          filters:
            - StripPrefix=0

        # ============ Booking Service Routes ============

        # Route 7: Booking (rental group) endpoints
        - id: booking-rentals-route
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - StripPrefix=0

        # Route 8: Driver profile endpoints
        - id: booking-drivers-route
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/drivers/**
          filters:
            - StripPrefix=0

        # Route 9: Payment endpoints
        - id: booking-payments-route
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0

        # Route 10: Dashboard stats endpoints (booking-service aggregates)
        - id: booking-dashboard-route
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/dashboard/**
          filters:
            - StripPrefix=0

        # Route 11: Feedback endpoints
        - id: booking-feedbacks-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/feedbacks/**
          filters:
            - StripPrefix=0

        # Route 10: Vehicle proxy (booking-service lấy từ car-management qua Feign)
        - id: booking-vehicle-proxy-route
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/vehicles/**
          filters:
            - StripPrefix=0

# Disable Eureka (using static URLs instead)
eureka:
  client:
    enabled: false

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
